name: Deploy via FTP

on:
  push:
    branches:
      - main
      - demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Debug dist folder contents
        run: |
          echo "Listing contents of dist/"
          ls -la dist || echo "dist/ does not exist!"

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SFTP_SSH_KEY }}
          passphrase: ${{ secrets.SFTP_SSH_KEY_PASSPHRASE }}
          port: ${{ secrets.FTP_PORT || 22 }}
          source: "dist/*"
          target: ${{ github.ref == 'refs/heads/main' && '/portal.crechespots.co.za/' || '/demo.crechespots.co.za/' }}
          rm: true

