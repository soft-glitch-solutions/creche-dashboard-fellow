name: Deploy via SFTP

on:
  push:
    branches:
      - main
      - demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Deploy to Production via SFTP
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 102.212.247.146
          port: 1624
          username: njfhditm
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: /portal.crechespots.co.za/
          dangerous-clean-slate: true

      - name: Deploy to Demo via SFTP
        if: github.ref == 'refs/heads/demo'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 102.212.247.146
          port: 1624
          username: njfhditm
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: dist/
          server-dir: /demo.crechespots.co.za/
          dangerous-clean-slate: true