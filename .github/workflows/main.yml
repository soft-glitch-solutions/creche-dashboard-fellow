name: Deploy to cPanel

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch (adjust as needed)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # Specify the version of Node.js

      - name: Install dependencies
        run: |
          npm install

      - name: Build the app
        run: |
          npm run build

      - name: Copy files to server (via SSH)
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.CPANEL_HOST }}   # The IP/hostname of your server
          username: ${{ secrets.CPANEL_USER }}  # Your cPanel username
          password: ${{ secrets.CPANEL_PASS }}  # Your cPanel password
          port: 22  # Default SSH port
          script: |
            # Remove existing files in the target directory
            rm -rf /home/njfhditm/portal.crechespots.co.za/*

            # Copy the new build to the server
            mkdir -p /home/njfhditm/portal.crechespots.co.za/
            cp -r ./build/* /home/njfhditm/portal.crechespots.co.za/
