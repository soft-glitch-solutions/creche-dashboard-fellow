name: Deploy via FTP

on:
  push:
    branches:
      - main  # Deploy when pushing to the main branch
      - demo  # Deploy when pushing to the demo branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Deploy via SCP (no rsync)
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SFTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT || 22 }}
          local-dir: dist/  # This is your build directory
          server-dir: ${{ github.ref == 'refs/heads/main' && '/portal.crechespots.co.za/' || '/demo.crechespots.co.za/' }}  # Change dynamically based on branch
          cleanup: true  # Remove old files before uploading
